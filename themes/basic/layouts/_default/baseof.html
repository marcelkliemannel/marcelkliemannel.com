<!DOCTYPE html>
<html lang="{{ .Site.Params.metaLanguage }}">
  {{- partial "head.html" . -}}
  <body>
    {{- partial "header.html" . -}}
    <main class="main">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}

    <div id="toast" role="status" aria-live="polite"></div>

    {{ $mainJs := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint }}
    <script src="{{ $mainJs.Permalink }}" defer></script>
  </body>
</html>
